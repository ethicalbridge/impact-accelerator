name: DNS check
on:
  push:
    branches: [dns-check]
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait until both addresses have a valid certificate
        run: |
          for i in $(seq 1 80); do
            a=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://handova.org/ || true)
            w=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://www.handova.org/ || true)
            echo "try $i: apex=$a www=$w"
            if [ "$a" = "200" ] && { [ "$w" = "301" ] || [ "$w" = "200" ]; }; then echo "::notice title=ready::apex=$a www=$w after $i tries"; exit 0; fi
            sleep 30
          done
          echo "::notice title=not ready::apex=$a www=$w"
